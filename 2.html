<!DOCTYPE html>
<html>
<head>
    <title>Course Registration</title>
</head>
<body style="font-family: sans-serif; padding: 20px;">

    <h2 style="text-align: center;">Course Registration Form</h2>

    <form>
        <table border="1" cellpadding="10" style="margin: auto; width: 80%; border-collapse: collapse;">
            <tr>
                <th>Field</th>
                <th>Input Details</th>
            </tr>
            <tr>
                <td>Name</td>
                <td><input type="text" name="name" required></td>
            </tr>
            <tr>
                <td>Department</td>
                <td>
                    <select name="dept">
                        <option>ISE</option>
                        <option>CSE</option>
                        <option>ECE</option>
                    </select>
                </td>
            </tr>
            <tr>
                <td>USN</td>
                <td><input type="text" name="usn" maxlength="10" pattern="1DS[0-9]{2}[A-Z]{2}[0-9]{3}" title="Format: 1DS followed by 2 digits, 2 uppercase letters, and 3 digits (e.g., 1DS20IS001)" required></td>
            </tr>
            <tr>
                <td>Email</td>
                <td><input type="email" name="email" required></td>
            </tr>
            <tr>
                <td>Core Subjects</td>
                <td>
                    <input type="checkbox"> Big Data Analytics<br>
                    <input type="checkbox"> Full Stack Development<br>
                    <input type="checkbox"> Software Engineering and SoftwareTesting
                </td>
            </tr>
            <tr>
                <td>Upload Document</td>
                <td><input type="file" name="doc"></td>
            </tr>
            <tr>
                <td colspan="2" align="center">
                    <button type="submit">Submit Form</button>
                </td>
            </tr>
        </table>
    </form>

</body>
</html>
