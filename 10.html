<!DOCTYPE html>
<html>
<head>
    <title>Undertaking Form</title>
    <style>
        body { font-family: sans-serif; background: #f4f6f9; padding: 20px; }
        .container { width: 400px; background: white; padding: 20px; margin: auto; border-radius: 10px; box-shadow: 0 0 10px gray; }
        input, textarea, button { width: 100%; padding: 10px; margin-top: 10px; box-sizing: border-box; }
        button { background: #007bff; color: white; border: none; cursor: pointer; }
    </style>
</head>
<body>
    <div class="container">
        <h2>Undertaking Form</h2>
        <form action="/submit" method="POST">
            <input type="text" name="name" placeholder="Name" required>
            <input type="text" name="usn" placeholder="USN" required>
            <input type="text" name="department" placeholder="Department" required>
            <textarea name="reason" placeholder="Reason" required></textarea>
            <input type="date" name="date" required>
            <input type="text" name="signature" placeholder="Signature" required>
            <button type="submit">Submit</button>
        </form>
    </div>
</body>
</html>
